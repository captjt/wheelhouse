<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Wheelhouse</title>
    <script>
      // A pinned theme (Light or Dark) applies before the first paint; System follows macOS.
      try {
        var t = JSON.parse(localStorage.getItem("wh:theme") || '"system"');
        if (t === "light" || t === "dark") document.documentElement.dataset.mode = t;
      } catch (e) {}
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='11' fill='none' stroke='%23f6821f' stroke-width='3'/><circle cx='16' cy='16' r='3' fill='%23f6821f'/></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
