[package]
name = "wheelhouse"
version = "0.1.0"
edition = "2024"
# Let chains (`if let … && …`) need 1.88.
rust-version = "1.88"
description = "Wheelhouse: every piece of agent work as a docket, on a record you can check"
license = "MIT"
repository = "https://github.com/captjt/wheelhouse"
homepage = "https://www.superlogical.com/rex"
publish = false

[[bin]]
name = "wh"
path = "src/main.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = { version = "4.6.12", features = ["unstable-dynamic"] }
ed25519-compact = "2.6.0"
include_dir = "0.7.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10.9"
time = { version = "0.3.55", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
web-push-native = "0.5.0"
