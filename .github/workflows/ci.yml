# What a pull request needs to pass: `just check`, on macOS (Wheelhouse is a
# Mac app: it drives Rex, the Keychain and launchd). macOS 26 has Xcode 26,
# which Wheelhouse.app needs (Swift 6.2).
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: mac/.build
          key: swiftpm-${{ hashFiles('mac/Package.resolved') }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Tools the tests use
        run: brew install just luajit
      - name: just check
        run: just check
      - name: A Build, end to end, with stand-ins
        run: just e2e
